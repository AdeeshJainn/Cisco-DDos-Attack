name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --project engine
      - name: ruff format
        run: uv run --project engine ruff format --check .
      - name: ruff lint
        run: uv run --project engine ruff check .
      - name: pytest
        run: uv run --project engine pytest
        env:
          HYPOTHESIS_PROFILE: ci
      - name: labels isolation lint
        # Placeholder until the ground-truth writer exists; replaced by an AST
        # check that nothing under argus/ imports labels or reads label files.
        run: echo "labels-isolation lint activates with the contracts phase"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: install
        run: npm ci
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test
      - name: build
        run: npm run build
