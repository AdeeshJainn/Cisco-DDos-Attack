name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --project engine
      - name: ruff format
        run: uv run --project engine ruff format --check .
      - name: ruff lint
        run: uv run --project engine ruff check .
      - name: pytest
        run: uv run --project engine pytest
        env:
          HYPOTHESIS_PROFILE: ci
      - name: labels isolation lint
        # AST guard: nothing outside the scenario generator may import the
        # ground-truth writer or reference label file paths.
        run: uv run --project engine python scripts/lint_labels_isolation.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: install
        run: npm ci
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test
      - name: build
        run: npm run build
